name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: tests.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 60
    name: Execute Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14" # Adjust according to your needs

      - name: Install Dependencies
        run: yarn install

      - name: Execute Test Tools
        run: yarn test:tools
